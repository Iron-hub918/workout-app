<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>IRON LOG — 増量・減量AIコーチ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#0E0F12;
  --surface:#17191E;
  --surface-2:#1D2026;
  --border:#2B2E35;
  --text:#F1EEE7;
  --text-muted:#8B8E96;
  --amber:#E3A93B;
  --amber-dim:#8A6A28;
  --bulk:#5C9B6E;
  --cut:#C1584B;
  --danger:#C1584B;
  --radius:2px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:64px;
}

h1,h2,h3,.num{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
  letter-spacing:0.01em;
}

::selection{background:var(--amber);color:#141414;}
a{color:inherit;}

/* Top bar */
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(14,15,18,0.92);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--border);
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:baseline;
  gap:8px;
}

.brand .mark{
  width:10px;
  height:10px;
  background:var(--amber);
  display:inline-block;
  transform:rotate(45deg);
}

.brand h1{
  font-size:22px;
  margin:0;
  line-height:1;
}

.phase-badge{
  font-size:12px;
  padding:4px 10px;
  border:1px solid var(--border);
  color:var(--text-muted);
}

.phase-badge.bulk{
  color:var(--bulk);
  border-color:var(--bulk);
}

.phase-badge.cut{
  color:var(--cut);
  border-color:var(--cut);
}

.wrap{
  max-width:640px;
  margin:0 auto;
  padding:0 16px;
}

/* Onboarding */
.onboard{
  padding:32px 0 60px;
}

.onboard-hero{
  margin-bottom:28px;
}

.onboard-hero .kicker{
  color:var(--amber);
  font-size:13px;
  font-weight:600;
  letter-spacing:0.02em;
}

.onboard-hero h2{
  font-size:34px;
  margin:6px 0 8px;
  line-height:1.05;
}

.onboard-hero p{
  color:var(--text-muted);
  font-size:15px;
  line-height:1.6;
  max-width:46ch;
}

form{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field label{
  font-size:13px;
  color:var(--text-muted);
}

.field input[type=number],
.field input[type=text],
.field input[type=date],
.field select{
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  padding:12px 14px;
  font-size:16px;
  border-radius:var(--radius);
  font-family:'Inter',sans-serif;
  width:100%;
}

.field input:focus,
.field select:focus{
  outline:none;
  border-color:var(--amber);
}

.row2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.choice-group{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.choice-group.two{
  grid-template-columns:repeat(2,1fr);
}

.choice-btn{
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text-muted);
  padding:12px 8px;
  text-align:center;
  font-size:14px;
  cursor:pointer;
  border-radius:var(--radius);
}

.choice-btn.active{
  border-color:var(--amber);
  color:var(--amber);
  background:rgba(227,169,59,0.08);
}

.btn-primary{
  background:var(--amber);
  color:#141414;
  border:none;
  padding:15px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  border-radius:var(--radius);
  margin-top:8px;
  font-family:'Inter',sans-serif;
}

.btn-primary:disabled{
  opacity:0.4;
}

.btn-secondary{
  background:transparent;
  color:var(--text);
  border:1px solid var(--border);
  padding:13px;
  font-size:15px;
  cursor:pointer;
  border-radius:var(--radius);
  font-family:'Inter',sans-serif;
}

.hint{
  font-size:12px;
  color:var(--text-muted);
  line-height:1.5;
}

/* Dashboard */
.dash{
  padding:20px 0 40px;
}

.coach-card{
  background:var(--surface);
  border-left:3px solid var(--amber);
  padding:20px 18px;
  margin-bottom:22px;
}

.coach-card .kicker{
  color:var(--amber);
  font-size:12px;
  font-weight:600;
  letter-spacing:0.03em;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.coach-card .kicker span.date{
  color:var(--text-muted);
  font-weight:400;
}

.coach-card p{
  font-size:15.5px;
  line-height:1.65;
  margin:0;
  white-space:pre-wrap;
}

.coach-card .refresh-row{
  margin-top:14px;
  display:flex;
  gap:10px;
  align-items:center;
}

.link-btn{
  background:none;
  border:none;
  color:var(--amber);
  font-size:13px;
  cursor:pointer;
  padding:0;
  font-family:'Inter',sans-serif;
}

.loading-dot{
  color:var(--text-muted);
  font-size:13px;
}

.stat-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1px;
  background:var(--border);
  border:1px solid var(--border);
  margin-bottom:18px;
}

.stat{
  background:var(--surface);
  padding:14px 16px;
}

.stat .label{
  font-size:11.5px;
  color:var(--text-muted);
  text-transform:none;
  margin-bottom:4px;
}

.stat .value{
  font-size:26px;
  line-height:1;
  font-family:'Barlow Condensed',sans-serif;
  font-weight:600;
}

.stat .value small{
  font-size:14px;
  color:var(--text-muted);
  font-weight:500;
  margin-left:2px;
}

.stat .sub{
  font-size:11.5px;
  color:var(--text-muted);
  margin-top:3px;
}

.stat .value.pos{
  color:var(--bulk);
}

.stat .value.neg{
  color:var(--cut);
}

.pfc-row{
  display:flex;
  border:1px solid var(--border);
  margin-bottom:18px;
}

.pfc-item{
  flex:1;
  padding:14px;
  text-align:center;
  border-right:1px solid var(--border);
}

.pfc-item:last-child{
  border-right:none;
}

.pfc-item .label{
  font-size:11px;
  color:var(--text-muted);
}

.pfc-item .value{
  font-size:20px;
  font-family:'Barlow Condensed',sans-serif;
  font-weight:600;
  margin-top:3px;
}

.section-title{
  font-size:13px;
  color:var(--text-muted);
  margin:26px 0 10px;
  letter-spacing:0.02em;
}

.log-form{
  background:var(--surface);
  border:1px solid var(--border);
  padding:16px;
  margin-bottom:10px;
}

.log-form .row2{
  margin-bottom:12px;
}

.tabs{
  display:flex;
  gap:2px;
  margin-bottom:14px;
  border:1px solid var(--border);
}

.tab{
  flex:1;
  text-align:center;
  padding:10px;
  font-size:13px;
  color:var(--text-muted);
  cursor:pointer;
  background:var(--surface);
}

.tab.active{
  color:var(--amber);
  background:var(--surface-2);
}

.chart-box{
  background:var(--surface);
  border:1px solid var(--border);
  padding:14px;
  margin-bottom:16px;
  height:230px;
}

.chart-box canvas{
  max-height:100%;
}

.footer-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(14,15,18,0.95);
  backdrop-filter:blur(6px);
  border-top:1px solid var(--border);
  display:flex;
  z-index:50;
}

.nav-btn{
  flex:1;
  text-align:center;
  padding:12px 0 10px;
  font-size:12px;
  color:var(--text-muted);
  background:none;
  border:none;
  cursor:pointer;
  font-family:'Inter',sans-serif;
}

.nav-btn.active{
  color:var(--amber);
}

.nav-btn .ico{
  display:block;
  font-size:16px;
  margin-bottom:3px;
}

.settings-block{
  background:var(--surface);
  border:1px solid var(--border);
  padding:16px;
  margin-bottom:14px;
}

.settings-block h3{
  font-size:15px;
  margin:0 0 12px;
  font-weight:600;
}

.danger-zone{
  margin-top:30
