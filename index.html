<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>IRON LOG — 増量・減量AIコーチ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#0E0F12;
  --surface:#17191E;
  --surface-2:#1D2026;
  --border:#2B2E35;
  --text:#F1EEE7;
  --text-muted:#8B8E96;
  --amber:#E3A93B;
  --amber-dim:#8A6A28;
  --bulk:#5C9B6E;
  --cut:#C1584B;
  --danger:#C1584B;
  --radius:2px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:64px;
}
h1,h2,h3,.num{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
  letter-spacing:0.01em;
}
::selection{background:var(--amber);color:#141414;}
a{color:inherit;}

/* Top bar */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(14,15,18,0.92);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--border);
  padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;
}
.brand{
  display:flex;align-items:baseline;gap:8px;
}
.brand .mark{
  width:10px;height:10px;background:var(--amber);
  display:inline-block;transform:rotate(45deg);
}
.brand h1{font-size:22px;margin:0;line-height:1;}
.phase-badge{
  font-size:12px;padding:4px 10px;border:1px solid var(--border);
  color:var(--text-muted);
}
.phase-badge.bulk{color:var(--bulk);border-color:var(--bulk);}
.phase-badge.cut{color:var(--cut);border-color:var(--cut);}

.wrap{max-width:640px;margin:0 auto;padding:0 16px;}

/* Onboarding */
.onboard{padding:32px 0 60px;}
.onboard-hero{margin-bottom:28px;}
.onboard-hero .kicker{color:var(--amber);font-size:13px;font-weight:600;letter-spacing:0.02em;}
.onboard-hero h2{font-size:34px;margin:6px 0 8px;line-height:1.05;}
.onboard-hero p{color:var(--text-muted);font-size:15px;line-height:1.6;max-width:46ch;}

form{display:flex;flex-direction:column;gap:18px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:13px;color:var(--text-muted);}
.field input[type=number],.field input[type=text],.field select{
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  padding:12px 14px;
  font-size:16px;
  border-radius:var(--radius);
  font-family:'Inter',sans-serif;
  width:100%;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--amber);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.choice-group{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.choice-group.two{grid-template-columns:repeat(2,1fr);}
.choice-btn{
  background:var(--surface);border:1px solid var(--border);color:var(--text-muted);
  padding:12px 8px;text-align:center;font-size:14px;cursor:pointer;border-radius:var(--radius);
}
.choice-btn.active{border-color:var(--amber);color:var(--amber);background:rgba(227,169,59,0.08);}

.btn-primary{
  background:var(--amber);color:#141414;border:none;
  padding:15px;font-size:16px;font-weight:600;cursor:pointer;
  border-radius:var(--radius);margin-top:8px;font-family:'Inter',sans-serif;
}
.btn-primary:disabled{opacity:0.4;}
.btn-secondary{
  background:transparent;color:var(--text);border:1px solid var(--border);
  padding:13px;font-size:15px;cursor:pointer;border-radius:var(--radius);font-family:'Inter',sans-serif;
}
.hint{font-size:12px;color:var(--text-muted);line-height:1.5;}

/* Dashboard */
.dash{padding:20px 0 40px;}
.coach-card{
  background:var(--surface);
  border-left:3px solid var(--amber);
  padding:20px 18px;
  margin-bottom:22px;
}
.coach-card .kicker{color:var(--amber);font-size:12px;font-weight:600;letter-spacing:0.03em;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.coach-card .kicker span.date{color:var(--text-muted);font-weight:400;}
.coach-card p{font-size:15.5px;line-height:1.65;margin:0;white-space:pre-wrap;}
.coach-card .refresh-row{margin-top:14px;display:flex;gap:10px;align-items:center;}
.link-btn{background:none;border:none;color:var(--amber);font-size:13px;cursor:pointer;padding:0;font-family:'Inter',sans-serif;}
.loading-dot{color:var(--text-muted);font-size:13px;}

.stat-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:1px;
  background:var(--border);
  border:1px solid var(--border);
  margin-bottom:18px;
}
.stat{background:var(--surface);padding:14px 16px;}
.stat .label{font-size:11.5px;color:var(--text-muted);text-transform:none;margin-bottom:4px;}
.stat .value{font-size:26px;line-height:1;font-family:'Barlow Condensed',sans-serif;font-weight:600;}
.stat .value small{font-size:14px;color:var(--text-muted);font-weight:500;margin-left:2px;}
.stat .sub{font-size:11.5px;color:var(--text-muted);margin-top:3px;}
.stat .value.pos{color:var(--bulk);}
.stat .value.neg{color:var(--cut);}

.pfc-row{display:flex;border:1px solid var(--border);margin-bottom:18px;}
.pfc-item{flex:1;padding:14px;text-align:center;border-right:1px solid var(--border);}
.pfc-item:last-child{border-right:none;}
.pfc-item .label{font-size:11px;color:var(--text-muted);}
.pfc-item .value{font-size:20px;font-family:'Barlow Condensed',sans-serif;font-weight:600;margin-top:3px;}

.section-title{font-size:13px;color:var(--text-muted);margin:26px 0 10px;letter-spacing:0.02em;}

.log-form{background:var(--surface);border:1px solid var(--border);padding:16px;margin-bottom:10px;}
.log-form .row2{margin-bottom:12px;}

.tabs{display:flex;gap:2px;margin-bottom:14px;border:1px solid var(--border);}
.tab{flex:1;text-align:center;padding:10px;font-size:13px;color:var(--text-muted);cursor:pointer;background:var(--surface);}
.tab.active{color:var(--amber);background:var(--surface-2);}
.chart-box{background:var(--surface);border:1px solid var(--border);padding:14px;margin-bottom:16px;height:230px;}
.chart-box canvas{max-height:100%;}

.footer-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(14,15,18,0.95);backdrop-filter:blur(6px);
  border-top:1px solid var(--border);
  display:flex;z-index:50;
}
.nav-btn{
  flex:1;text-align:center;padding:12px 0 10px;font-size:12px;color:var(--text-muted);
  background:none;border:none;cursor:pointer;font-family:'Inter',sans-serif;
}
.nav-btn.active{color:var(--amber);}
.nav-btn .ico{display:block;font-size:16px;margin-bottom:3px;}

.settings-block{background:var(--surface);border:1px solid var(--border);padding:16px;margin-bottom:14px;}
.settings-block h3{font-size:15px;margin:0 0 12px;font-weight:600;}
.danger-zone{margin-top:30px;}
.danger-zone button{width:100%;background:none;border:1px solid var(--cut);color:var(--cut);padding:12px;cursor:pointer;border-radius:var(--radius);}

.hidden{display:none !important;}
.small-note{font-size:11.5px;color:var(--text-muted);margin-top:6px;}
</style>
</head>
<body>

<div id="app"></div>

<div class="footer-nav hidden" id="footerNav">
  <button class="nav-btn" data-view="dashboard"><span class="ico">◆</span>ダッシュボード</button>
  <button class="nav-btn" data-view="log"><span class="ico">＋</span>記録する</button>
  <button class="nav-btn" data-view="charts"><span class="ico">▲</span>グラフ</button>
  <button class="nav-btn" data-view="settings"><span class="ico">⚙</span>設定</button>
</div>

<script>
/* =========================================================
   IRON LOG — bodyweight/bodyfat driven AI bulk/cut coach
   All numeric logic lives in JS. The AI API is only ever
   asked to phrase coaching guidance from numbers we give it.
========================================================= */

const STORE_KEY = 'ironlog_data_v1';

function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveData(d){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(d));
    return true;
  }catch(e){
    alert('データの保存に失敗しました。ブラウザのサイトデータ/Cookie設定（プライベートブラウジングなど）をご確認ください。\n(' + e.message + ')');
    return false;
  }
}

let DATA = loadData();
let currentView = 'dashboard';
let chartTab = 'weight';

/* ---------- calculation engine ---------- */

function computeBMR(p){
  const base = 10*p.weight + 6.25*p.height - 5*p.age;
  return p.gender === 'male' ? base + 5 : base - 161;
}
const ACTIVITY_MULT = { low:1.375, medium:1.55, high:1.725 };

function computeInitialTDEE(p){
  return Math.round(computeBMR(p) * ACTIVITY_MULT[p.activity]);
}

// returns {calMultiplier, lo, hi} — a *range* of acceptable weekly weight-change
// rates for the current body-fat reading. The specific point within [lo,hi]
// that becomes this week's target is chosen by the AI coaching call (see
// decideTargetRate), not hardcoded here.
function phaseRange(goal, bf, settings){
  if(goal === 'bulk'){
    // overall bulk range across a whole bulk: 0.25%〜0.50%/week
    if(bf < 13) return { calMultiplier: 1.10, lo: 0.35, hi: 0.50 };
    return { calMultiplier: 1.05, lo: 0.25, hi: 0.35 };
  }
  if(goal === 'cut'){
    if(bf > settings.cutThreshold) return { calMultiplier: 0.80, lo: -1.00, hi: -0.75 };
    return { calMultiplier: 0.80, lo: -0.75, hi: -0.50 };
  }
  // minicut: short, single aggressive range (no body-fat split)
  return { calMultiplier: 0.80, lo: -1.00, hi: -0.75 };
}

function computePFC(goal, calories, weightKg){
  let pPerKg, fPerKg;
  if(goal === 'bulk'){ pPerKg = 1.9; fPerKg = 0.8; }
  else { pPerKg = 2.6; fPerKg = 0.6; } // cut & minicut

  const protein = Math.round(pPerKg * weightKg);
  const fat = Math.round(fPerKg * weightKg);
  const remaining = Math.max(0, calories - protein*4 - fat*9);
  const carb = Math.round(remaining / 4);
  return { protein, fat, carb };
}

function avg(arr){ return arr.reduce((a,b)=>a+b,0) / arr.length; }

function sortedLogs(){
  return [...DATA.logs].sort((a,b)=> a.date.localeCompare(b.date));
}

// last N days ending at (and including) the most recent log, walking backward
function lastNDays(n, offsetFromEnd){
  const logs = sortedLogs();
  offsetFromEnd = offsetFromEnd || 0;
  const end = logs.length - offsetFromEnd;
  const slice = logs.slice(Math.max(0, end - n), end);
  return slice;
}

function computeAverages(){
  const logs = sortedLogs();
  if(logs.length < 7) return null;
  const current7 = lastNDays(7, 0);
  const currentAvg = avg(current7.map(l=>l.weight));
  let prevAvg = null, weeklyRate = null;
  if(logs.length >= 14){
    const prev7 = lastNDays(7, 7);
    prevAvg = avg(prev7.map(l=>l.weight));
    weeklyRate = (currentAvg - prevAvg) / prevAvg * 100;
  }
  return { currentAvg, prevAvg, weeklyRate, count: logs.length };
}

function latestBF(){
  const logs = sortedLogs();
  return logs.length ? logs[logs.length-1].bodyFat : DATA.profile.bodyFat;
}
function latestWeight(){
  const logs = sortedLogs();
  return logs.length ? logs[logs.length-1].weight : DATA.profile.weight;
}

const STEP_MIN = 100, STEP_MAX = 200, STEP_DEFAULT = 150;

function apiHeaders(){
  return {
    "Content-Type": "application/json",
    "x-api-key": DATA.apiKey || "",
    "anthropic-version": "2023-06-01",
    "anthropic-dangerous-direct-browser-access": "true"
  };
}
function extractJson(text){
  const match = text.match(/\{[\s\S]*\}/);
  return match ? JSON.parse(match[0]) : JSON.parse(text);
}

// AI picks the specific weekly target rate within the mandated [lo,hi] range,
// based on recent trend. All downstream math (diff vs target, kcal step,
// PFC, TDEE) stays fully deterministic in JS — this call only supplies the
// judgment-based target point, clamped to the range as a safety net.
async function decideTargetRate(range, ctx){
  const mid = (range.lo + range.hi) / 2;
  if(!DATA.apiKey){
    return { targetRate: Number(mid.toFixed(2)), rationale: 'APIキー未設定のため範囲の中央値を暫定使用しています。' };
  }
  try{
    const sys = `あなたはボディビルダーの栄養コーチです。与えられた範囲[${range.lo}%〜${range.hi}%]/週の中から、直近の体重推移をもとに今週目指すべき体重変化率を1つだけ選んでください。範囲の外の値は絶対に選ばないでください。JSON以外の文字は一切出力せず、次の形式だけを返してください: {"targetRate": 数値, "reason": "一言(20字程度)"}`;
    const u = `フェーズ: ${ctx.goalLabel}
現在の体脂肪率: ${ctx.bf}%
直近の7日平均体重の推移(古い→新しい): ${ctx.recentAvgs.map(v=>v.toFixed(2)).join(' → ')}kg
前回の目標変化率: ${ctx.prevTargetRate !== null ? ctx.prevTargetRate + '%/週' : 'なし(初回)'}
選べる範囲: ${range.lo}%〜${range.hi}%/週`;
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: apiHeaders(),
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 200, system: sys, messages: [{ role:"user", content:u }] })
    });
    const data = await response.json();
    const text = (data.content || []).map(c=>c.text||'').join('').trim();
    const parsed = extractJson(text);
    let rate = Number(parsed.targetRate);
    if(isNaN(rate)) rate = mid;
    rate = Math.max(range.lo, Math.min(range.hi, rate));
    return { targetRate: Number(rate.toFixed(2)), rationale: parsed.reason || '' };
  }catch(e){
    return { targetRate: Number(mid.toFixed(2)), rationale: 'AI呼び出しに失敗したため範囲の中央値を暫定使用しています。' };
  }
}

// The weekly engine: phase-range selection -> AI picks target within range ->
// compare to actual -> adjust calories -> update TDEE. Only the target-rate
// point is AI-judged; every calculation is done here in JS.
async function runWeeklyEngine(){
  const s = DATA.state;
  const avgs = computeAverages();
  if(!avgs || avgs.weeklyRate === null) return null;

  const bf = latestBF();
  const range = phaseRange(DATA.profile.goal, bf, DATA.settings);
  const rangeChanged = (s.targetRateLo !== range.lo || s.targetRateHi !== range.hi);

  const logs = sortedLogs();
  const recentAvgs = [];
  for(let off = 21; off >= 0; off -= 7){
    const slice = lastNDays(7, off);
    if(slice.length === 7) recentAvgs.push(avg(slice.map(l=>l.weight)));
  }
  const goalLabel = {bulk:'増量',cut:'減量',minicut:'ミニカット'}[DATA.profile.goal];

  const decision = await decideTargetRate(range, {
    goalLabel, bf, recentAvgs, prevTargetRate: s.targetRate
  });

  let forcedReset = false;
  if(rangeChanged){
    s.calories = Math.round(s.tdee * range.calMultiplier);
    forcedReset = true;
  }
  s.targetRateLo = range.lo;
  s.targetRateHi = range.hi;
  s.targetRate = decision.targetRate;

  const diff = avgs.weeklyRate - s.targetRate;
  let adjustment = 0;
  let action = 'maintain';
  if(!forcedReset){
    if(diff > 0.1){
      adjustment = -STEP_DEFAULT;
      action = 'decrease';
    } else if(diff < -0.1){
      adjustment = STEP_DEFAULT;
      action = 'increase';
    }
    s.calories = Math.max(1200, s.calories + adjustment);
  }

  // PFC recompute
  const pfc = computePFC(DATA.profile.goal, s.calories, latestWeight());
  s.protein = pfc.protein; s.fat = pfc.fat; s.carb = pfc.carb;

  // TDEE re-estimation from realized data: since we no longer collect a logged
  // intake figure, assume adherence to the calories the app itself prescribed
  // over the comparison week and compare that to the actual weight trend.
  if(avgs.prevAvg !== null){
    const assumedIntake = s.calories;
    const expectedWeeklyKg = (assumedIntake - s.tdee) * 7 / 7700;
    const actualWeeklyKg = (avgs.currentAvg - avgs.prevAvg);
    const errorKg = actualWeeklyKg - expectedWeeklyKg;
    let tdeeAdj = (errorKg * 7700 / 7) * 0.5; // damped
    tdeeAdj = Math.max(-100, Math.min(100, tdeeAdj));
    s.tdee = Math.round(s.tdee + tdeeAdj);
  }

  s.lastAdjustmentDate = todayStr();
  s.phase = DATA.profile.goal;

  const entry = {
    date: todayStr(),
    weeklyRate: avgs.weeklyRate,
    targetRate: s.targetRate,
    targetRateLo: range.lo,
    targetRateHi: range.hi,
    rationale: decision.rationale,
    bodyFat: bf,
    calories: s.calories,
    tdee: s.tdee,
    action, forcedReset
  };
  DATA.adjustmentLog = DATA.adjustmentLog || [];
  DATA.adjustmentLog.push(entry);

  return { avgs, entry, bf };
}

function checkPhaseEnd(bf){
  const g = DATA.profile.goal;
  if(g === 'bulk' && bf >= DATA.settings.bulkEndBf) return `体脂肪率が${DATA.settings.bulkEndBf}%に到達しました。増量終了のタイミングを検討してください。`;
  if(g === 'cut' && bf <= DATA.settings.competitionBf) return `体脂肪率が目標の${DATA.settings.competitionBf}%に到達しました。減量終了のタイミングを検討してください。`;
  if(g === 'minicut' && bf <= DATA.settings.miniCutTarget) return `体脂肪率が目標の${DATA.settings.miniCutTarget}%に到達しました。ミニカット終了のタイミングを検討してください。`;
  return null;
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

/* ---------- AI coaching text ---------- */

async function generateCoachingMessage(context){
  const goalLabel = {bulk:'増量',cut:'減量',minicut:'ミニカット'}[DATA.profile.goal];
  const sys = `あなたはボディビルダー専属の栄養コーチです。渡された数値データだけをもとに、今週ユーザーが何をすべきかを日本語で2〜4文、具体的かつ簡潔に指示してください。数値の再計算はせず、渡された数値をそのまま根拠として使ってください。丁寧だが端的なコーチの口調で。マークダウンや箇条書きは使わないでください。`;

  const u = `フェーズ: ${goalLabel}
現在の体脂肪率: ${context.bf}%
今週の7日平均体重: ${context.avgs.currentAvg.toFixed(2)}kg
前週の7日平均体重: ${context.avgs.prevAvg ? context.avgs.prevAvg.toFixed(2) : 'ー'}kg
週間体重変化率: ${context.avgs.weeklyRate.toFixed(2)}%/week
今週の目標範囲: ${context.entry.targetRateLo}%〜${context.entry.targetRateHi}%/week
AIが範囲内で選んだ今週の目標値: ${context.entry.targetRate}%/week (理由: ${context.entry.rationale || 'ー'})
今週とった処置: ${context.entry.action === 'maintain' ? 'カロリー維持' : context.entry.action === 'decrease' ? 'カロリーを減らした' : 'カロリーを増やした'}${context.entry.forcedReset ? '(体脂肪率の閾値を超えたためフェーズのカロリーと目標範囲を切り替えた)' : ''}
現在の摂取カロリー: ${context.entry.calories}kcal
推定TDEE: ${context.entry.tdee}kcal
PFC: P${DATA.state.protein}g / F${DATA.state.fat}g / C${DATA.state.carb}g
${context.phaseEndNote ? '注意: ' + context.phaseEndNote : ''}`;

  if(DATA.apiKey){
    try{
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: apiHeaders(),
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 400,
          system: sys,
          messages: [{ role: "user", content: u }]
        })
      });
      const data = await response.json();
      const text = (data.content || []).map(c=>c.text||'').join('').trim();
      if(text) return text;
    }catch(e){ /* fall through to template */ }
  }

  // deterministic fallback if no API key is set or the call fails
  let msg = '';
  if(context.entry.action === 'maintain'){
    msg = `週間体重変化率は${context.avgs.weeklyRate.toFixed(2)}%/weekで、今週の目標(${context.entry.targetRate}%/week、範囲${context.entry.targetRateLo}〜${context.entry.targetRateHi}%/week)に近い状態です。現在の摂取カロリー(${context.entry.calories}kcal)を維持してください。`;
  } else if(context.entry.action === 'decrease'){
    msg = `週間体重変化率が${context.avgs.weeklyRate.toFixed(2)}%/weekと目標(${context.entry.targetRate}%/week)より速いペースです。摂取カロリーを${context.entry.calories}kcalまで引き下げました。`;
  } else {
    msg = `週間体重変化率が${context.avgs.weeklyRate.toFixed(2)}%/weekと目標(${context.entry.targetRate}%/week)より遅いペースです。摂取カロリーを${context.entry.calories}kcalまで引き上げました。`;
  }
  if(context.entry.forcedReset){
    msg += ` 体脂肪率が${context.bf}%になり閾値を超えたため、フェーズの基準カロリーと目標範囲(${context.entry.targetRateLo}〜${context.entry.targetRateHi}%/week)を切り替えました。`;
  }
  if(context.phaseEndNote) msg += ' ' + context.phaseEndNote;
  return msg;
}

/* ---------- rendering ---------- */

function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function render(){
  const app = document.getElementById('app');
  const footerNav = document.getElementById('footerNav');
  if(!DATA){
    footerNav.classList.add('hidden');
    app.innerHTML = '';
    app.appendChild(renderOnboarding());
    return;
  }
  footerNav.classList.remove('hidden');
  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.view === currentView);
  });
  app.innerHTML = '';
  app.appendChild(renderTopbar());
  const wrap = el('<div class="wrap"></div>');
  if(currentView === 'dashboard') wrap.appendChild(renderDashboard());
  if(currentView === 'log') wrap.appendChild(renderLogView());
  if(currentView === 'charts') wrap.appendChild(renderChartsView());
  if(currentView === 'settings') wrap.appendChild(renderSettingsView());
  app.appendChild(wrap);
}

function renderTopbar(){
  const goalLabel = {bulk:'増量',cut:'減量',minicut:'ミニカット'}[DATA.profile.goal];
  const bar = el(`<div class="topbar">
    <div class="brand"><span class="mark"></span><h1>IRON LOG</h1></div>
    <div class="phase-badge ${DATA.profile.goal==='bulk'?'bulk':'cut'}">${goalLabel}フェーズ</div>
  </div>`);
  return bar;
}

/* ---- onboarding ---- */
function renderOnboarding(){
  const container = el(`<div class="wrap onboard">
    <div class="onboard-hero">
      <div class="kicker">INITIAL SETUP</div>
      <h2>まず、あなたの数字を教えてください。</h2>
      <p>年齢・身長・現在の体重と体脂肪率から初期TDEEを推定し、目的に応じた摂取カロリーとPFCを自動で設定します。以降は毎朝の体重・体脂肪率の2つだけ記録すれば、AIが毎週の調整を指示します。</p>
    </div>
    <form id="onboardForm"></form>
  </div>`);

  const form = container.querySelector('#onboardForm');
  const state = { gender:'male', activity:'medium', goal:'bulk' };

  form.appendChild(el(`
    <div class="field"><label>年齢</label><input type="number" id="f_age" min="14" max="80" required></div>
  `));
  form.appendChild(el(`
    <div class="field"><label>性別</label>
      <div class="choice-group two" id="genderGroup">
        <button type="button" class="choice-btn active" data-val="male">男性</button>
        <button type="button" class="choice-btn" data-val="female">女性</button>
      </div>
    </div>
  `));
  form.appendChild(el(`
    <div class="row2">
      <div class="field"><label>身長 (cm)</label><input type="number" id="f_height" step="0.1" required></div>
      <div class="field"><label>現在の体重 (kg)</label><input type="number" id="f_weight" step="0.1" required></div>
    </div>
  `));
  form.appendChild(el(`
    <div class="field"><label>現在の体脂肪率 (%)</label><input type="number" id="f_bf" step="0.1" required></div>
  `));
  form.appendChild(el(`
    <div class="field"><label>週間の運動量</label>
      <div class="choice-group" id="activityGroup">
        <button type="button" class="choice-btn" data-val="low">Low</button>
        <button type="button" class="choice-btn active" data-val="medium">Medium</button>
        <button type="button" class="choice-btn" data-val="high">High</button>
      </div>
    </div>
  `));
  form.appendChild(el(`
    <div class="field"><label>目的</label>
      <div class="choice-group" id="goalGroup">
        <button type="button" class="choice-btn active" data-val="bulk">増量</button>
        <button type="button" class="choice-btn" data-val="cut">減量</button>
        <button type="button" class="choice-btn" data-val="minicut">ミニカット</button>
      </div>
      <div class="hint">目標の体重変化率は固定値ではなく範囲で自動設定され、体脂肪率の推移に応じてAIが範囲内で毎週の目標値を選びます。細かい閾値は登録後に設定画面から調整できます。</div>
    </div>
  `));

  form.querySelector('#genderGroup').addEventListener('click', e=>{
    const btn = e.target.closest('.choice-btn'); if(!btn) return;
    state.gender = btn.dataset.val;
    [...btn.parentElement.children].forEach(c=>c.classList.remove('active'));
    btn.classList.add('active');
  });
  form.querySelector('#activityGroup').addEventListener('click', e=>{
    const btn = e.target.closest('.choice-btn'); if(!btn) return;
    state.activity = btn.dataset.val;
    [...btn.parentElement.children].forEach(c=>c.classList.remove('active'));
    btn.classList.add('active');
  });
  form.querySelector('#goalGroup').addEventListener('click', e=>{
    const btn = e.target.closest('.choice-btn'); if(!btn) return;
    state.goal = btn.dataset.val;
    [...btn.parentElement.children].forEach(c=>c.classList.remove('active'));
    btn.classList.add('active');
  });

  form.appendChild(el(`<button type="submit" class="btn-primary">初期プランを計算する</button>`));

  form.addEventListener('submit', (e)=>{
    e.preventDefault();
    const ageVal = form.querySelector('#f_age').value;
    const heightVal = form.querySelector('#f_height').value;
    const weightVal = form.querySelector('#f_weight').value;
    const bfVal = form.querySelector('#f_bf').value;
    if(ageVal === '' || heightVal === '' || weightVal === '' || bfVal === ''){
      alert('年齢・身長・体重・体脂肪率をすべて入力してください。');
      return;
    }
    const profile = {
      age: Number(ageVal),
      gender: state.gender,
      height: Number(heightVal),
      weight: Number(weightVal),
      bodyFat: Number(bfVal),
      activity: state.activity,
      goal: state.goal
    };
    if(Object.values(profile).some(v => typeof v === 'number' && isNaN(v))){
      alert('数値の入力に誤りがあります。半角数字で入力してください。');
      return;
    }
    // Sensible built-in defaults for phase-end / switch thresholds — no manual
    // entry at registration. Adjustable later from the settings screen.
    const settings = { cutThreshold: 10, bulkEndBf: 16, competitionBf: 8, miniCutTarget: 8 };

    const tdee = computeInitialTDEE(profile);
    const range = phaseRange(profile.goal, profile.bodyFat, settings);
    const calories = Math.round(tdee * range.calMultiplier);
    const pfc = computePFC(profile.goal, calories, profile.weight);
    const midRate = Number(((range.lo + range.hi) / 2).toFixed(2));

    DATA = {
      profile, settings, apiKey: '',
      state: {
        tdee, calories,
        targetRate: midRate, targetRateLo: range.lo, targetRateHi: range.hi,
        protein: pfc.protein, fat: pfc.fat, carb: pfc.carb,
        phase: profile.goal,
        lastAdjustmentDate: null
      },
      logs: [{ date: todayStr(), weight: profile.weight, bodyFat: profile.bodyFat }],
      adjustmentLog: [],
      coachingLog: []
    };
    if(!saveData(DATA)){ DATA = null; return; }
    currentView = 'dashboard';
    render();
  });

  return container;
}

/* ---- dashboard ---- */
function renderDashboard(){
  const c = el('<div class="dash"></div>');
  const avgs = computeAverages();
  const bf = latestBF();
  const s = DATA.state;

  // coaching hero card
  const lastCoaching = DATA.coachingLog[DATA.coachingLog.length-1];
  const canRunWeekly = avgs && avgs.weeklyRate !== null && (!s.lastAdjustmentDate || daysBetween(s.lastAdjustmentDate, todayStr()) >= 7);

  const card = el(`<div class="coach-card">
    <div class="kicker"><span>今週のAI指示</span><span class="date">${lastCoaching ? lastCoaching.date : ''}</span></div>
    <p id="coachText">${lastCoaching ? escapeHtml(lastCoaching.message) : (avgs && avgs.weeklyRate !== null ? '「更新」を押すと、今週のデータをもとにAIが指示を出します。' : 'データが7日分たまるまでは1日ごとの体重を記録してください。7日平均が出てから週間の指示が始まります。')}</p>
    <div class="refresh-row">
      <button class="link-btn" id="refreshCoach">${canRunWeekly ? '今週の指示を更新' : (avgs && avgs.weeklyRate !== null ? '前回の更新から7日未満です' : '')}</button>
    </div>
  </div>`);
  if(!canRunWeekly) card.querySelector('#refreshCoach').setAttribute('disabled','disabled');
  card.querySelector('#refreshCoach').addEventListener('click', async ()=>{
    const button = card.querySelector('#refreshCoach');
    button.textContent = '分析中…';
    button.setAttribute('disabled','disabled');
    const result = await runWeeklyEngine();
    if(result){
      const phaseEndNote = checkPhaseEnd(result.bf);
      const message = await generateCoachingMessage({...result, phaseEndNote});
      DATA.coachingLog.push({ date: todayStr(), message });
      saveData(DATA);
      render();
    }
  });
  c.appendChild(card);

  if(!DATA.apiKey){
    c.appendChild(el(`<div class="hint" style="margin:-10px 0 18px;">AIコーチの判断を使うには、設定画面でAPIキーを登録してください。未登録の間は範囲の中央値を使った簡易版で動作します。</div>`));
  }

  // stat grid
  const weeklyRateStr = avgs && avgs.weeklyRate !== null ? `${avgs.weeklyRate>0?'+':''}${avgs.weeklyRate.toFixed(2)}<small>%/週</small>` : '―';
  const weeklyClass = avgs && avgs.weeklyRate !== null ? (avgs.weeklyRate >= 0 ? 'pos' : 'neg') : '';
  const grid = el(`<div class="stat-grid">
    <div class="stat"><div class="label">今日の体重</div><div class="value">${latestWeight().toFixed(1)}<small>kg</small></div></div>
    <div class="stat"><div class="label">今日の体脂肪率</div><div class="value">${bf.toFixed(1)}<small>%</small></div></div>
    <div class="stat"><div class="label">今週7日平均</div><div class="value">${avgs ? avgs.currentAvg.toFixed(2) : '―'}<small>${avgs?'kg':''}</small></div></div>
    <div class="stat"><div class="label">前週7日平均</div><div class="value">${avgs && avgs.prevAvg ? avgs.prevAvg.toFixed(2) : '―'}<small>${avgs&&avgs.prevAvg?'kg':''}</small></div></div>
    <div class="stat"><div class="label">週間体重変化率</div><div class="value ${weeklyClass}">${weeklyRateStr}</div></div>
    <div class="stat"><div class="label">今週の目標(AI選定)</div><div class="value">${s.targetRate>0?'+':''}${s.targetRate}<small>%/週</small></div><div class="sub">範囲 ${s.targetRateLo}〜${s.targetRateHi}%/週</div></div>
    <div class="stat"><div class="label">推定TDEE</div><div class="value">${s.tdee}<small>kcal</small></div></div>
    <div class="stat"><div class="label">現在の摂取カロリー</div><div class="value">${s.calories}<small>kcal</small></div></div>
  </div>`);
  c.appendChild(grid);

  const pfc = el(`<div class="pfc-row">
    <div class="pfc-item"><div class="label">PROTEIN</div><div class="value">${s.protein}g</div></div>
    <div class="pfc-item"><div class="label">FAT</div><div class="value">${s.fat}g</div></div>
    <div class="pfc-item"><div class="label">CARB</div><div class="value">${s.carb}g</div></div>
  </div>`);
  c.appendChild(pfc);

  return c;
}

function daysBetween(a,b){
  const d1 = new Date(a), d2 = new Date(b);
  return Math.round((d2-d1)/86400000);
}
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

/* ---- log entry view ---- */
function renderLogView(){
  const c = el('<div class="dash"></div>');
  c.appendChild(el('<div class="section-title">毎日の記録</div>'));

  const todayLog = DATA.logs.find(l=>l.date === todayStr());
  const form = el(`<form class="log-form">
    <div class="field"><label>日付</label><input type="date" id="l_date" value="${todayStr()}" max="${todayStr()}"></div>
    <div class="row2">
      <div class="field"><label>体重 (kg)</label><input type="number" step="0.1" id="l_weight" value="${todayLog?todayLog.weight:''}" required></div>
      <div class="field"><label>体脂肪率 (%)</label><input type="number" step="0.1" id="l_bf" value="${todayLog?todayLog.bodyFat:''}" required></div>
    </div>
    <button type="submit" class="btn-primary">記録を保存</button>
  </form>`);

  form.addEventListener('submit', e=>{
    e.preventDefault();
    const date = form.querySelector('#l_date').value || todayStr();
    const weight = Number(form.querySelector('#l_weight').value);
    const bodyFat = Number(form.querySelector('#l_bf').value);
    const entry = { date, weight, bodyFat };

    const idx = DATA.logs.findIndex(l=>l.date === date);
    if(idx >= 0) DATA.logs[idx] = entry; else DATA.logs.push(entry);
    saveData(DATA);
    currentView = 'dashboard';
    render();
  });
  c.appendChild(form);
  c.appendChild(el(`<div class="hint">体重は起床後・トイレ後・飲食前など、毎日同じ条件で測定してください。体脂肪率は1日の数値だけで判断せず、推移で見ます。</div>`));

  // recent entries
  const logs = sortedLogs().slice(-10).reverse();
  if(logs.length){
    c.appendChild(el('<div class="section-title">直近の記録</div>'));
    const list = el('<div></div>');
    logs.forEach(l=>{
      list.appendChild(el(`<div class="stat" style="border:1px solid var(--border);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;">
        <div class="sub">${l.date}</div>
        <div class="sub">${l.weight}kg ・ ${l.bodyFat}%</div>
      </div>`));
    });
    c.appendChild(list);
  }

  return c;
}

/* ---- charts view ---- */
let chartInstance = null;
function renderChartsView(){
  const c = el('<div class="dash"></div>');
  const tabs = el(`<div class="tabs">
    <div class="tab" data-t="weight">体重</div>
    <div class="tab" data-t="bodyfat">体脂肪率</div>
    <div class="tab" data-t="calorie">カロリー/TDEE</div>
    <div class="tab" data-t="pfc">PFC</div>
  </div>`);
  [...tabs.children].forEach(t=>{
    if(t.dataset.t === chartTab) t.classList.add('active');
    t.addEventListener('click', ()=>{ chartTab = t.dataset.t; render(); });
  });
  c.appendChild(tabs);

  const box = el('<div class="chart-box"><canvas id="mainChart"></canvas></div>');
  c.appendChild(box);

  setTimeout(()=>drawChart(), 0);
  return c;
}

function drawChart(){
  const canvas = document.getElementById('mainChart');
  if(!canvas || typeof Chart === 'undefined') return;
  if(chartInstance) chartInstance.destroy();

  const logs = sortedLogs();
  const labels = logs.map(l=>l.date.slice(5));

  const gridColor = 'rgba(255,255,255,0.06)';
  const textColor = '#8B8E96';
  const baseOpts = {
    responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{ labels:{ color:'#F1EEE7', font:{size:11} } } },
    scales:{
      x:{ ticks:{ color:textColor, font:{size:10} }, grid:{ color:gridColor } },
      y:{ ticks:{ color:textColor, font:{size:10} }, grid:{ color:gridColor } }
    }
  };

  let datasets = [];
  if(chartTab === 'weight'){
    const rolling = logs.map((l,i)=>{
      if(i < 6) return null;
      const slice = logs.slice(i-6, i+1);
      return avg(slice.map(x=>x.weight));
    });
    datasets = [
      { label:'体重', data: logs.map(l=>l.weight), borderColor:'#E3A93B', backgroundColor:'transparent', tension:0.25, pointRadius:2 },
      { label:'7日平均', data: rolling, borderColor:'#5C9B6E', backgroundColor:'transparent', tension:0.25, pointRadius:0, borderWidth:2 }
    ];
  } else if(chartTab === 'bodyfat'){
    datasets = [
      { label:'体脂肪率', data: logs.map(l=>l.bodyFat), borderColor:'#C1584B', backgroundColor:'transparent', tension:0.25, pointRadius:2 }
    ];
  } else if(chartTab === 'calorie'){
    const adj = DATA.adjustmentLog || [];
    const calByDate = {}; adj.forEach(a=>calByDate[a.date]=a.calories);
    const tdeeByDate = {}; adj.forEach(a=>tdeeByDate[a.date]=a.tdee);
    datasets = [
      { label:'設定カロリー(処方値)', data: logs.map(l=> calByDate[l.date] || null), borderColor:'#E3A93B', backgroundColor:'transparent', tension:0.1, pointRadius:2, spanGaps:true },
      { label:'推定TDEE', data: logs.map(l=> tdeeByDate[l.date] || null), borderColor:'#5C9B6E', backgroundColor:'transparent', tension:0.1, pointRadius:2, spanGaps:true }
    ];
  } else if(chartTab === 'pfc'){
    // approximate historical PFC from adjustment log snapshots is not tracked per-day;
    // show current PFC breakdown as a simple bar instead of a misleading timeseries.
    canvas.parentElement.innerHTML = `<div style="display:flex;height:100%;align-items:flex-end;gap:20px;justify-content:center;padding-bottom:10px;">
      ${['protein','fat','carb'].map(k=>{
        const val = DATA.state[k];
        const label = {protein:'P',fat:'F',carb:'C'}[k];
        const color = {protein:'#E3A93B',fat:'#C1584B',carb:'#5C9B6E'}[k];
        const h = Math.min(180, val/3);
        return `<div style="text-align:center;">
          <div style="width:44px;height:${h}px;background:${color};margin:0 auto;"></div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:6px;">${label} ${val}g</div>
        </div>`;
      }).join('')}
    </div>`;
    return;
  }

  chartInstance = new Chart(canvas, { type:'line', data:{ labels, datasets }, options: baseOpts });
}

/* ---- settings view ---- */
function renderSettingsView(){
  const c = el('<div class="dash"></div>');

  c.appendChild(el('<div class="section-title">AIコーチ (APIキー)</div>'));
  const apiBlock = el(`<div class="settings-block">
    <div class="field"><label>APIキー</label><input type="password" id="s_apiKey" placeholder="APIキーを入力" value="${DATA.apiKey || ''}"></div>
    <div class="small-note">このアプリはブラウザ単体で動作します。AIによる週次コーチングを使うには、APIキーをここに入力してください。キーはこの端末のブラウザ内だけに保存され、AIサービスとの通信にのみ使われます。未入力の場合は範囲の中央値を使った簡易ロジックで動作します。</div>
    <button type="button" class="btn-secondary" id="saveApiKey" style="margin-top:12px;">キーを保存</button>
  </div>`);
  apiBlock.querySelector('#saveApiKey').addEventListener('click', ()=>{
    DATA.apiKey = apiBlock.querySelector('#s_apiKey').value.trim();
    saveData(DATA);
    render();
  });
  c.appendChild(apiBlock);

  c.appendChild(el('<div class="section-title">プロフィール</div>'));
  const p = DATA.profile;
  c.appendChild(el(`<div class="settings-block">
    <div class="sub" style="color:var(--text-muted);font-size:13px;line-height:1.9;">
      年齢: ${p.age} ／ 性別: ${p.gender==='male'?'男性':'女性'}<br>
      身長: ${p.height}cm<br>
      運動量: ${ {low:'Low',medium:'Medium',high:'High'}[p.activity] }<br>
      目的: ${ {bulk:'増量',cut:'減量',minicut:'ミニカット'}[p.goal] }
    </div>
  </div>`));

  c.appendChild(el('<div class="section-title">フェーズ設定</div>'));
  const block = el('<div class="settings-block"></div>');
  if(p.goal === 'bulk'){
    block.appendChild(el(`<div class="field"><label>増量終了の目安体脂肪率(%)</label><input type="number" step="0.1" id="s_bulkEnd" value="${DATA.settings.bulkEndBf}"></div>`));
  } else if(p.goal === 'cut'){
    block.appendChild(el(`<div class="field"><label>減速閾値の体脂肪率(%)</label><input type="number" step="0.1" id="s_cutThresh" value="${DATA.settings.cutThreshold}"></div>`));
    block.appendChild(el(`<div class="field" style="margin-top:10px;"><label>減量終了目標体脂肪率(%)</label><input type="number" step="0.1" id="s_compBf" value="${DATA.settings.competitionBf}"></div>`));
  } else {
    block.appendChild(el(`<div class="field"><label>ミニカット目標体脂肪率(%)</label><input type="number" step="0.1" id="s_miniTarget" value="${DATA.settings.miniCutTarget}"></div>`));
  }
  block.appendChild(el(`<button type="button" class="btn-secondary" id="saveSettings" style="margin-top:14px;">設定を保存</button>`));
  block.querySelector('#saveSettings').addEventListener('click', ()=>{
    if(p.goal === 'bulk') DATA.settings.bulkEndBf = Number(block.querySelector('#s_bulkEnd').value);
    else if(p.goal === 'cut'){
      DATA.settings.cutThreshold = Number(block.querySelector('#s_cutThresh').value);
      DATA.settings.competitionBf = Number(block.querySelector('#s_compBf').value);
    } else {
      DATA.settings.miniCutTarget = Number(block.querySelector('#s_miniTarget').value);
    }
    saveData(DATA);
    render();
  });
  c.appendChild(block);

  const danger = el('<div class="danger-zone"><button id="resetAll">すべてのデータを削除してリセット</button></div>');
  danger.querySelector('#resetAll').addEventListener('click', ()=>{
    if(confirm('本当にすべてのデータを削除しますか？この操作は取り消せません。')){
      localStorage.removeItem(STORE_KEY);
      DATA = null;
      currentView = 'dashboard';
      render();
    }
  });
  c.appendChild(danger);

  return c;
}

/* ---------- nav wiring ---------- */
document.getElementById('footerNav').addEventListener('click', (e)=>{
  const btn = e.target.closest('.nav-btn');
  if(!btn) return;
  currentView = btn.dataset.view;
  render();
});

render();
</script>
